<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>赛博终端 · 登录页预览</title>
  <link rel="stylesheet" href="./common.css" />
  <style>
    :root { color-scheme: dark; }
    body { color: #f8f7f5; background: #110f18; }
    .preview-page { position: relative; display: grid; place-items: center; isolation: isolate; background: radial-gradient(ellipse at 57% 53%, #211328 0%, #17111e 42%, #101116 100%); }
    .preview-page::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .35; background: repeating-linear-gradient(0deg, transparent 0 3px, #96ffc008 3px 4px); pointer-events: none; }
    .matrix-rain { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; opacity: .82; pointer-events: none; }
    .terminal-layout { width: min(88vw, 2240px); display: grid; grid-template-columns: minmax(0, 1.73fr) minmax(390px, .97fr); align-items: center; gap: clamp(48px, 6vw, 150px); }
    .terminal-window { min-height: clamp(360px, 45vh, 645px); padding: clamp(44px, 4.2vw, 94px); border-bottom: 6px solid #beff62; background: #18191cdd; box-shadow: 0 20px 55px #0004; }
    .terminal-lines { display: grid; gap: clamp(24px, 2.2vw, 44px); margin: 0; padding: 0; list-style: none; color: #c6ff73; font: clamp(25px, 2.35vw, 60px)/1.1 Consolas, "Courier New", monospace; white-space: nowrap; letter-spacing: .015em; }
    .terminal-lines li::before { content: ">"; margin-right: .65em; }
    .terminal-lines .cursor { display: inline-block; width: .95em; margin: 0 .15em; overflow: hidden; vertical-align: -.08em; filter: drop-shadow(0 0 8px #bfff64); animation: blink 1.35s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .18; } }
    .login-card { width: 100%; padding: clamp(36px, 3vw, 74px) clamp(36px, 3vw, 70px) 30px; border: 1px solid #795c8b; border-radius: 9px; background: #29202eaa; box-shadow: 0 0 30px #854c9d18, inset 0 1px #ffffff0c; text-align: center; }
    .login-card .preview-logo { width: clamp(110px, 7.5vw, 188px); height: clamp(110px, 7.5vw, 188px); margin: 0 auto 18px; }
    .login-card h1 { margin: 0 0 35px; font-size: clamp(26px, 2vw, 47px); line-height: 1.2; font-weight: 750; letter-spacing: .045em; white-space: nowrap; }
    .login-card input { height: clamp(56px, 3.5vw, 82px); margin-bottom: 14px; padding: 0 26px; border: 1px solid #735884; border-radius: 8px; color: #fff; background: #211e28a8; font-size: clamp(18px, 1.5vw, 28px); }
    .login-card input::placeholder { color: #aaa4ae; }
    .login-card button[type="submit"] { width: 100%; height: clamp(62px, 3.9vw, 86px); margin-top: 16px; border: 0; border-radius: 8px; color: #111918; background: linear-gradient(105deg, #b7ffd2, #a8ff3f); box-shadow: 0 0 25px #aaff6b55; font-size: clamp(20px, 1.55vw, 30px); font-weight: 650; }
    .login-card button[type="submit"]:hover { filter: brightness(1.08); }
    .login-card footer { margin-top: 17px; color: #a6a0a9; font-size: clamp(13px, 1vw, 20px); }
    @media (max-width: 1050px) { .terminal-layout { grid-template-columns: 1fr; gap: 24px; max-width: 690px; padding: 36px 0; } .terminal-window { min-height: 250px; padding: 34px; } .terminal-lines { font-size: clamp(20px, 4vw, 36px); gap: 18px; } .login-card { padding: 38px; } .login-card h1 { margin-bottom: 28px; } }
    @media (max-width: 560px) { .terminal-window { min-height: 195px; padding: 26px 18px; } .terminal-lines { font-size: clamp(14px, 4.4vw, 22px); } .login-card { padding: 28px 24px; } .login-card .preview-logo { width: 100px; height: 100px; margin-bottom: 14px; } .login-card h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <main class="preview-page">
    <canvas class="matrix-rain" aria-hidden="true"></canvas>
    <div class="terminal-layout">
      <section class="terminal-window" aria-label="终端欢迎信息"><ul class="terminal-lines"><li>boot cyber@hongfengling</li><li>auth --mode secure</li><li>link established <span class="cursor">...</span> ok</li></ul></section>
      <section class="login-card" aria-label="登录表单">
        <img class="preview-logo" src="../../../../frontend/src/brand/assets/maple-leaf.png" alt="" />
        <h1>赛博@红枫岭</h1>
        <form class="preview-form"><input aria-label="账号" autocomplete="username" placeholder="账号" required /><input aria-label="密码" type="password" autocomplete="current-password" placeholder="密码" required /><button type="submit">登录</button></form>
        <footer>© 2026 Cyber@HFL</footer>
      </section>
    </div>
    <p class="preview-notice" role="status" hidden>视觉预览页面，登录功能将在确认设计后接入。</p>
  </main>
  <script src="./preview.js"></script>
  <script src="./terminal-matrix.js"></script>
</body>
</html>
