<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>业主委员会</title>
    <script>
      // 首屏风格（ADR-027）：样式解析前同步设置 data-theme；管理端恒为 bento；格式不符或缺失则 bento
      (function () {
        var key = 'bento'
        try {
          var admin = location.pathname.indexOf('/admin') !== -1
          var saved = localStorage.getItem('ocap_theme')
          if (!admin && saved && /^[a-z][a-z0-9_-]{1,31}$/.test(saved)) key = saved
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', key)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
